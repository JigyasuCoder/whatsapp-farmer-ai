<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Sahayak - WhatsApp Marketplace</title>
    <style>
        :root {
            --wa-bg: #efeae2;
            --wa-header: #075e54;
            --wa-bubble-user: #d9fdd3;
            --wa-bubble-bot: #ffffff;
            --wa-icon: #54656f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #00a884; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .app-container {
            width: 100%; max-width: 480px; height: 100vh; max-height: 900px;
            background: var(--wa-bg); display: flex; flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: var(--wa-header); color: white; padding: 10px 16px;
            display: flex; align-items: center; gap: 12px; z-index: 10;
        }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-info h3 { font-size: 16px; font-weight: 600; }
        .header-info p { font-size: 12px; opacity: 0.8; }

        /* Chat Body */
        .chat-body {
            flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 16px 16px;
        }

        .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; word-wrap: break-word; }
        .message.user { background: var(--wa-bubble-user); align-self: flex-end; border-top-right-radius: 0; }
        .message.bot { background: var(--wa-bubble-bot); align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .message img { max-width: 100%; border-radius: 6px; margin-top: 4px; }
        .timestamp { font-size: 10px; color: #8696a0; text-align: right; margin-top: 4px; }

        /* Audio Player */
        audio { width: 100%; margin-top: 6px; height: 32px; }

        /* Footer Input Bar */
        .chat-footer { background: #f0f2f5; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #e0e0e0; }
        .icon-btn { background: none; border: none; font-size: 20px; color: var(--wa-icon); cursor: pointer; padding: 6px; border-radius: 50%; }
        .icon-btn:hover { background: #e0e0e0; }
        .icon-btn.recording { color: #ea4335; animation: pulse 1s infinite; }

        .input-box { flex: 1; background: white; border-radius: 20px; padding: 8px 16px; border: none; outline: none; font-size: 15px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="avatar">🌾</div>
        <div class="header-info">
            <h3>Kisan Sahayak AI</h3>
            <p>Online | Native Voice & Vision</p>
        </div>
    </div>

    <!-- Chat Messages Container -->
    <div class="chat-body" id="chatBody">
        <div class="message bot">
            🙏 Namaste! Ask me crop advisory queries in any language, upload a photo for quality grading, or share location for Mandi prices.
            <div class="timestamp">10:00 AM</div>
        </div>
    </div>

    <!-- Footer Action Bar -->
    <div class="chat-footer">
        <button class="icon-btn" onclick="triggerImageUpload()" title="Attach Crop Photo">📷</button>
        <button class="icon-btn" onclick="sendLocation()" title="Send Location">📍</button>
        <input type="file" id="fileInput" accept="image/*" onchange="handleImageSelected(event)">
        
        <input type="text" id="textInput" class="input-box" placeholder="Type message..." onkeypress="handleKeyPress(event)">
        
        <button class="icon-btn" id="micBtn" onclick="toggleRecording()" title="Hold/Click to Record Voice">🎙️</button>
        <button class="icon-btn" onclick="sendTextMessage()" title="Send">➤</button>
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Helper: Add Chat Bubble to UI
    function appendMessage(sender, text, imageUrl = null, audioUrl = null) {
        const chatBody = document.getElementById("chatBody");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;

        let content = text ? `<div>${text.replace(/\n/g, '<br>')}</div>` : '';
        if (imageUrl) content += `<img src="${imageUrl}">`;
        if (audioUrl) content += `<audio controls autoplay src="${audioUrl}"></audio>`;
        
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        content += `<div class="timestamp">${time}</div>`;

        msgDiv.innerHTML = content;
        chatBody.appendChild(msgDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // 1. Text Message Handler
    async function sendTextMessage() {
        const input = document.getElementById("textInput");
        const message = input.value.trim();
        if (!message) return;

        appendMessage("user", message);
        input.value = "";

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });
            const data = await res.json();
            appendMessage("bot", data.reply_text);
        } catch (e) {
            appendMessage("bot", "⚠️ Server connection failed.");
        }
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") sendTextMessage();
    }

    // 2. Microphone Audio Handler (Sarvam STT -> Gemini -> Sarvam TTS)
    async function toggleRecording() {
        const micBtn = document.getElementById("micBtn");

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                    const formData = new FormData();
                    formData.append("audio", audioBlob, "user_voice.ogg");

                    appendMessage("user", "🎙️ *Voice Note Sent*");

                    try {
                        const res = await fetch("/api/chat", { method: "POST", body: formData });
                        const data = await res.json();
                        
                        if (data.transcript) {
                            appendMessage("user", `*Transcribed:* ${data.transcript}`);
                        }
                        appendMessage("bot", data.reply_text || "Audio processed.", null, data.reply_audio_url);
                    } catch (e) {
                        appendMessage("bot", "⚠️ Voice processing failed.");
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add("recording");
            } catch (err) {
                alert("Microphone access denied or unavailable.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove("recording");
        }
    }

    // 3. Image Quality Handler
    function triggerImageUpload() {
        document.getElementById("fileInput").click();
    }

    async function handleImageSelected(event) {
        const file = event.target.files[0];
        if (!file) return;

        const imgUrl = URL.createObjectURL(file);
        appendMessage("user", "📷 *Uploading crop photo for inspection...*", imgUrl);

        // Fetch location in background for distance/Mandi calculation
        navigator.geolocation.getCurrentPosition(async (pos) => {
            sendImagePayload(file, pos.coords.latitude, pos.coords.longitude);
        }, () => {
            sendImagePayload(file, 12.9716, 77.5946); // Default Bengaluru Fallback
        });
    }

    async function sendImagePayload(file, lat, lon) {
        const formData = new FormData();
        formData.append("image", file);
        formData.append("latitude", lat);
        formData.append("longitude", lon);
        formData.append("state", "Karnataka");
        formData.append("language_code", "kn-IN"); // Set native language context

        try {
            const res = await fetch("/api/chat", { method: "POST", body: formData });
            const data = await res.json();
            appendMessage("bot", data.reply_text, null, data.reply_audio_url);
        } catch (e) {
            appendMessage("bot", "⚠️ Image analysis failed.");
        }
    }

    // 4. GPS Location Handler
    function sendLocation() {
        if (!navigator.geolocation) {
            alert("Geolocation not supported by browser.");
            return;
        }

        appendMessage("user", "📍 *Sharing current location...*");

        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude
                    })
                });
                const data = await res.json();
                appendMessage("bot", data.reply_text);
            } catch (e) {
                appendMessage("bot", "⚠️ Mandi calculation failed.");
            }
        }, () => {
            appendMessage("bot", "⚠️ Could not retrieve location permissions.");
        });
    }
</script>
</body>
</html>
